# Changed by Hunch, 2026: swift build and swift test with the Metal toolchain and MLX's shaders in the test bundle;
# the checkpoint tests skip.
# Derived from laya-mlx-swift (https://github.com/MstyAI/laya-mlx-swift, Apache-2.0); see NOTICE.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        run: |
          xcodebuild -version
          swift --version
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        # Swift's newer build system compiles MLX's Metal shaders into mlx-swift_Cmlx.bundle; the older native one
        # (the default before Swift 6.4) leaves them out, and every MLX call then fails to find default.metallib.
        run: swift build --build-tests --build-system swiftbuild
      # MLX looks for mlx-swift_Cmlx.bundle (its default.metallib) in the resources of every loaded bundle; the newer
      # build system copies it into the test bundle, as Xcode does for an app. Fail here, not in the tests, if it is
      # missing; copy it in if only the test bundle lacks it. The training tests need it even on the CPU.
      - name: Put MLX's shaders in the test bundle
        run: |
          bin="$(swift build --build-system swiftbuild --show-bin-path)"
          find "$bin/mlx-swift_Cmlx.bundle" -name default.metallib | grep -q . || { echo "no default.metallib" >&2; exit 1; }
          if [ ! -d "$bin/HunchTests.xctest/Contents/Resources/mlx-swift_Cmlx.bundle" ]; then
            mkdir -p "$bin/HunchTests.xctest/Contents/Resources"
            ditto "$bin/mlx-swift_Cmlx.bundle" "$bin/HunchTests.xctest/Contents/Resources/mlx-swift_Cmlx.bundle"
          fi
      - name: Test
        # The parity and benchmark tests need downloaded checkpoints and skip here.
        run: swift test --skip-build --build-system swiftbuild
