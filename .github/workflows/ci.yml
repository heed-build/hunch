# Changed by Hunch, 2026: swift build and swift test with the Metal toolchain; the checkpoint tests skip.
# Derived from laya-mlx-swift (https://github.com/MstyAI/laya-mlx-swift, Apache-2.0); see NOTICE.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        run: |
          xcodebuild -version
          swift --version
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: swift build --build-tests
      - name: Test
        # The parity and benchmark tests need downloaded checkpoints and skip here.
        run: swift test --skip-build
